<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloquear enlace</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 15vh;
}

h1 {
    font-size: clamp(28px, 6vw, 60px);
    text-align: center;
    margin: 0;
}

#button {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    padding: 18px 32px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
    transition: left 0.25s ease, top 0.25s ease, transform 0.25s ease;
}

#button:hover {
    background: #ddd;
}

#message {
    display: none;
    text-align: center;
    font-size: clamp(35px, 8vw, 80px);
    font-weight: bold;
    margin-top: 100px;
}

#submessage {
    font-size: clamp(20px, 4vw, 35px);
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">¿Quieres bloquear este enlace? 🤨</h1>

<button id="button">BLOQUEAR ENLACE WEB</button>

<div id="message">
JAJAJAJA 😭
<div id="submessage">
Desde aquí no se bloquea andaaa
</div>
</div>

</div>

<script>
const button = document.getElementById("button");
const title = document.getElementById("title");
const message = document.getElementById("message");

let attempts = 0;

button.addEventListener("click", () => {

    attempts++;

    if (attempts <= 3) {

        const margin = 20;

        const maxX = window.innerWidth - button.offsetWidth - margin;
        const maxY = window.innerHeight - button.offsetHeight - margin;

        const x = margin + Math.random() * (maxX - margin);
        const y = margin + Math.random() * (maxY - margin);

        button.style.left = `${x}px`;
        button.style.top = `${y}px`;
        button.style.transform = "none";

    } else {

        button.style.display = "none";
        title.style.display = "none";
        message.style.display = "block";

    }

});
</script>

</body>
</html>
